<!doctype html>
<html lang="en">
<head>
    <title>Sign In</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .login-hero {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(59, 93, 80, 0.35), rgba(46, 139, 87, 0.25)), 
                        url('images/signbg.jpg') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 4rem 3.5rem;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.15),
                0 0 0 1px rgba(255,255,255,0.3);
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(220, 229, 228, 0.5);
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b5d50, #2e8b57, #3b5d50);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .login-title {
            font-size: 36px;
            font-weight: 700;
            color: #2f2f2f;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            position: relative;
        }
        
        .login-subtitle {
            color: #6a6a6a;
            font-size: 16px;
            font-weight: 500;
        }
        
        .login-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #3b5d50, #2e8b57);
            border-radius: 2px;
            margin-top: 1rem;
        }
        
        .form-group {
            position: relative;
            margin-bottom: 1.75rem;
        }
        
        .form-control {
            height: 60px;
            padding: 0 20px 0 55px;
            border: 2px solid #dce5e4;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 500;
            background: rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            width: 100%;
        }
        
        .form-control:focus {
            border-color: #3b5d50;
            background: rgba(255,255,255,1);
            box-shadow: 0 0 0 4px rgba(59, 93, 80, 0.08);
            transform: translateY(-2px);
            outline: none;
        }
        
        .form-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a6a6a;
            font-size: 20px;
            z-index: 2;
        }
        
        .toggle-password {
            right: 22px !important;
            left: auto !important;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .toggle-password:hover {
            color: #3b5d50 !important;
        }
        
        .signin-btn {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #3b5d50 0%, #2e8b57 100%);
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(59, 93, 80, 0.3);
            margin: 1.5rem 0;
        }
        
        .signin-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(59, 93, 80, 0.4);
        }
        
        .signin-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        
        .signin-btn:hover::before {
            left: 100%;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 15px;
            color: #6a6a6a;
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #3b5d50;
        }
        
        .forgot-link {
            color: #3b5d50;
            font-weight: 500;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s ease;
        }
        
        .forgot-link:hover {
            color: #2e8b57;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #dce5e4;
        }
        
        .signup-link a {
            color: #3b5d50;
            font-weight: 600;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .signup-link a:hover {
            color: #2e8b57;
        }
        
        .divider {
            position: relative;
            text-align: center;
            margin: 2rem 0;
            color: #6a6a6a;
            font-size: 15px;
            font-weight: 500;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #dce5e4, transparent);
        }
        
        .divider span {
            background: rgba(255,255,255,0.9);
            padding: 0 2.5rem;
            position: relative;
        }
        
        .social-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        
        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #3b5d50;
            background: rgba(220, 229, 228, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-btn:hover {
            background: #3b5d50;
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(59, 93, 80, 0.35);
            border-color: rgba(255,255,255,0.4);
        }
        
        @media (max-width: 480px) {
            .login-card {
                max-width: 95%;
                padding: 3rem 2rem;
                margin: 1rem;
            }
            
            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-hero">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to your account</p>
            </div>
            
            <form class="signin-form" action="login.php" method="POST">
                <div class="form-group">
                    <i class="fas fa-user form-icon"></i>
                    <input id="username" name="username" type="text" class="form-control" placeholder="Username" required>
                </div>
                
                <div class="form-group">
                    <i class="fas fa-lock form-icon"></i>
                    <input id="password-field" name="password" type="password" class="form-control" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password" toggle="#password-field"></i>
                </div>
                
                <div class="checkbox-row">
                    <label>
                        <input type="checkbox" name="remember_me" checked> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                
                <button type="submit" class="signin-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
            </form>
            
            <div class="signup-link">
                <p>Don't have an account? <a href="sign-up.html">Sign up here</a></p>
            </div>
            
            <div class="divider">
                <span>or sign in with</span>
            </div>
            
            <div class="social-buttons">
                <a href="#" class="social-btn" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-btn" title="Google">
                    <i class="fab fa-google"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>

        $('.toggle-password').click(function() {
            let $input = $($(this).attr('toggle'));
            let type = $input.attr('type') === 'password' ? 'text' : 'password';
            $input.attr('type', type);
            $(this).toggleClass('fa-eye fa-eye-slash');
        });
    </script>
</body>
</html>
