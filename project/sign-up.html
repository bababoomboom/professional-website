<!doctype html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
        .login-hero {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(59, 93, 80, 0.35), rgba(46, 139, 87, 0.25)), 
                        url('images/signbg.jpg') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 4rem 3.5rem;
            box-shadow: 
                0 25px 50px rgba(0,0,0,0.15),
                0 0 0 1px rgba(255,255,255,0.3);
            max-width: 800px;  /* 🆕 WIDENED! */
            width: 100%;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(220, 229, 228, 0.5);
        }
        
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b5d50, #2e8b57, #3b5d50);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .login-title {
            font-size: 36px;
            font-weight: 700;
            color: #2f2f2f;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        
        .login-subtitle {
            color: #6a6a6a;
            font-size: 16px;
            font-weight: 500;
        }
        
        .login-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #3b5d50, #2e8b57);
            border-radius: 2px;
            margin-top: 1rem;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;  /* 🆕 PERFECT 2-COLUMN LAYOUT */
            gap: 1.5rem 2rem;
            margin-bottom: 2rem;
        }
        
        .form-group {
            position: relative;
            margin-bottom: 0;
        }
        
        .form-control {
            height: 56px;
            padding: 0 20px 0 50px;
            border: 2px solid #dce5e4;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 500;
            background: rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            width: 100%;
        }
        
        .form-control:focus {
            border-color: #3b5d50;
            background: rgba(255,255,255,1);
            box-shadow: 0 0 0 4px rgba(59, 93, 80, 0.08);
            transform: translateY(-2px);
            outline: none;
        }
        
        .form-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #6a6a6a;
            font-size: 18px;
            z-index: 2;
        }
        
        .toggle-password {
            right: 18px !important;
            left: auto !important;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .toggle-password:hover {
            color: #3b5d50 !important;
        }
        
        /* Full width password fields */
        .full-width {
            grid-column: 1 / -1;
        }
        
        .signup-btn {
            width: 100%;
            grid-column: 1 / -1;
            height: 60px;
            background: linear-gradient(135deg, #3b5d50 0%, #2e8b57 100%);
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(59, 93, 80, 0.3);
            margin-bottom: 1.5rem;
        }
        
        .signup-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(59, 93, 80, 0.4);
        }
        
        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }
        
        .signup-btn:hover::before {
            left: 100%;
        }
        
        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            grid-column: 1 / -1;
            padding: 0 1rem;
            margin-bottom: 1rem;
            font-size: 15px;
            color: #6a6a6a;
        }
        
        .checkbox-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #3b5d50;
        }
        
        .forgot-link {
            color: #3b5d50;
            font-weight: 500;
            text-decoration: none;
            font-size: 15px;
            transition: color 0.3s ease;
        }
        
        .forgot-link:hover {
            color: #2e8b57;
        }
        
        .divider {
            position: relative;
            text-align: center;
            grid-column: 1 / -1;
            margin: 2rem 0;
            color: #6a6a6a;
            font-size: 15px;
            font-weight: 500;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #dce5e4, transparent);
        }
        
        .divider span {
            background: rgba(255,255,255,0.9);
            padding: 0 2.5rem;
            position: relative;
        }
        
        .social-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            grid-column: 1 / -1;
        }
        
        .social-btn {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #3b5d50;
            background: rgba(220, 229, 228, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .social-btn:hover {
            background: #3b5d50;
            color: white;
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(59, 93, 80, 0.35);
            border-color: rgba(255,255,255,0.4);
        }
        
        @media (max-width: 768px) {
            .login-card {
                max-width: 95%;
                padding: 3rem 2rem;
                margin: 1rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
            }
            
            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-hero">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Create Account</h1>
                <p class="login-subtitle">Join us today</p>
            </div>
            
            <form class="signin-form" action="register.php" method="post">
    <div class="form-grid">
        <div class="form-group">
            <i class="fas fa-user form-icon"></i>
            <input id="username" name="username" type="text" class="form-control" placeholder="Username" required>
        </div>
        
        <div class="form-group">
            <i class="fas fa-envelope form-icon"></i>
            <input id="email" name="email" type="text" class="form-control" placeholder="Email Address" required>
        </div>
        
        <div class="form-group">
            <i class="fas fa-user form-icon"></i>
            <input id="first-name" name="first_name" type="text" class="form-control" placeholder="First Name" required>
        </div>
        
        <div class="form-group">
            <i class="fas fa-user form-icon"></i>
            <input id="last-name" name="last_name" type="text" class="form-control" placeholder="Last Name" required>
        </div>
        
        <div class="form-group">
            <i class="fas fa-graduation-cap form-icon"></i>
            <input id="grade" name="grade" type="text" class="form-control" placeholder="Grade" required>
        </div>
        
        <div class="form-group">
            <i class="fas fa-id-card form-icon"></i>
            <input id="ad-no" name="admission_no" type="text" class="form-control" placeholder="Admission No." required>
        </div>
        
        <div class="form-group full-width">
            <i class="fas fa-lock form-icon"></i>
            <input id="password-field" name="password" type="password" class="form-control" placeholder="Password" required>
            <i class="fas fa-eye toggle-password" toggle="#password-field"></i>
        </div>
        
        <div class="form-group full-width">
            <i class="fas fa-lock form-icon"></i>
            <input id="password-verify" name="confirm_password" type="password" class="form-control" placeholder="Confirm Password" required>
            <i class="fas fa-eye toggle-password" toggle="#password-verify"></i>
        </div>
    </div>
    
    <div class="checkbox-row">
        <label>
            <input type="checkbox" name="remember_me" checked> Remember me
        </label>
        <a href="#" class="forgot-link">Forgot Password?</a>
    </div>
    
    <button type="submit" class="signup-btn">
        <i class="fas fa-user-plus me-2"></i>Create Account
    </button>
</form>

            <div class="signin-link">
                <p>Have an account? <a href="sign-in.html">Sign in here</a></p>
            </div>
            
            <div class="divider">
                <span>or continue with</span>
            </div>
            
            <div class="social-buttons">
                <a href="#" class="social-btn" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="#" class="social-btn" title="Google">
                    <i class="fab fa-google"></i>
                </a>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // ✅ Password toggle ONLY
    $('.toggle-password').click(function() {
        let $input = $($(this).attr('toggle'));
        let type = $input.attr('type') === 'password' ? 'text' : 'password';
        $input.attr('type', type);
        $(this).toggleClass('fa-eye fa-eye-slash');
    });
    
    // ✅ Password match validation WITHOUT preventing submit
    $('form').submit(function(e) {
        let pwd1 = $('#password-field').val();
        let pwd2 = $('#password-verify').val();
        
        if (pwd1 !== pwd2) {
            e.preventDefault();  // ✅ Only prevent if passwords don't match
            alert('🔒 Passwords must match!');
            return false;
        }
        // ✅ If passwords match, form WILL submit to register.php
    });
</script>
</body>
</html>
